# =============================================================================
# Crypto Market Research Laboratory — Project Configuration
# =============================================================================
#
# This is the single source of truth for all research parameters.
#
# IMPORTANT: All values here are validated at startup by
# src/crypto_research/config/schema.py using Pydantic v2.
# Invalid values will stop execution immediately.
#
# IMPORTANT: Do NOT hard-code research parameters in Python modules.
# All configurable values must live here.
#
# For documentation on each section, see config/README.md

project:
  name: crypto_market_research_lab
  version: "1.0.0"

research:
  market: crypto
  data_source: binance
  # Note: Actual Binance data ingestion is implemented in Prompt 02.
  # In Prompt 01, this is configuration-only.

# ── Assets ─────────────────────────────────────────────────────────────────
# Initial research universe.
# Add new assets here — do NOT modify Python source to add assets.
#
# NOTE: Only include liquid perpetual futures pairs that exist on Binance.
# NOTE: Survivorship bias — the research universe must be chosen carefully.
#       Assets added post-hoc based on known performance is data snooping.
assets:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

# ── Timeframes ──────────────────────────────────────────────────────────────
# Timeframes to include in research experiments.
# Valid values: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h
timeframes:
  - 1m
  - 5m
  - 15m
  - 1h

# ── Risk Management ─────────────────────────────────────────────────────────
# NOTE: These parameters are configuration placeholders.
# Actual risk management logic is implemented in Prompt 05.
#
# DO NOT treat these values as validated research assumptions.
# They are starting points for future investigation.
risk:
  # Initial research hypothesis: 1R risk for 3R reward.
  # This is a hypothesis, not a guaranteed outcome.
  risk_reward_ratio: 3.0

  # Maximum capital to risk on a single trade (as % of total capital).
  risk_per_trade_pct: 1.0

  # Maximum number of simultaneously open positions across all assets/strategies.
  max_concurrent_positions: 5

  # Daily loss limit (as % of capital). Stops new position opening when reached.
  max_daily_loss_pct: 3.0

  # Daily profit target (as % of capital). Optional — null disables.
  # When reached, no new positions are opened for the rest of the day.
  daily_profit_target_pct: 2.0

# ── Execution Simulation ─────────────────────────────────────────────────────
# NOTE: Both values are null in Prompt 01.
# Execution simulation engine is implemented in Prompt 03.
#
# fee_rate: Trading fee as a fraction (e.g. 0.001 = 0.1%).
#           Set to null until Prompt 03. Setting it now would be premature.
# slippage_model: Identifier for the slippage model.
#                 Options (future): 'none', 'fixed', 'percentage', 'market_impact'
execution:
  fee_rate: null
  slippage_model: null

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: INFO
  # Log format: 'console' (colored, human-readable) or 'structured' (JSON)
  format: console
