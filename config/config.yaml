# =============================================================================
# Crypto Market Research Laboratory — Project Configuration
# =============================================================================
#
# This is the single source of truth for all research parameters.
#
# All values are validated at startup by src/crypto_research/config/schema.py
# Invalid values will stop execution immediately — no fallbacks.
#
# For documentation on each section, see config/README.md

project:
  name: crypto_market_research_lab
  version: "1.0.0"

research:
  market: crypto
  data_source: binance

# ── Assets ─────────────────────────────────────────────────────────────────
# Initial research universe. Add new assets here — never in Python source.
#
# SURVIVORSHIP BIAS WARNING: Only include assets whose listing dates
# are known and respected by the ingestion pipeline.
assets:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

# ── Timeframes ──────────────────────────────────────────────────────────────
# Valid values: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h
timeframes:
  - 1m
  - 5m
  - 15m
  - 1h

# ── Data Ingestion (Prompt 02) ───────────────────────────────────────────────
data:
  # Market type. 'futures' uses Binance USDT-margined perpetual contracts.
  # Valid values: 'futures', 'spot'
  market_type: futures

  # =========================================================================
  # FULL HISTORICAL RESEARCH RANGE
  # =========================================================================
  # These dates define the COMPLETE historical dataset for research.
  #
  # ⚠️  NOTE FOR INITIAL SETUP:
  #     The validation notebook (02_binance_data_ingestion.ipynb) uses a
  #     SHORT DEMO RANGE (last 30 days) to run quickly during acceptance
  #     testing. The dates below are the TARGET full-research range.
  #
  # 🔄  HOW TO DOWNLOAD THE FULL RANGE:
  #     1. Ensure these dates cover the period you want to research.
  #     2. Run the ingestion script directly (not the notebook):
  #            python3 -m crypto_research.data.ingestion
  #        Or call DataIngestionPipeline.run() with use_full_range=True.
  #     3. Expect ~15-25 minutes per symbol for 1m data over 2+ years.
  #
  # SOLUSDT listing date on Binance Futures: September 2020.
  # ETHUSDT listing date on Binance Futures: September 2019.
  # BTCUSDT listing date on Binance Futures: September 2019.
  # Requesting data before listing returns empty → recorded as-is, not filled.
  start_date: "2024-01-01"
  end_date: "2026-09-01"
  # =========================================================================

  # Storage directories (relative to project root)
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_dir: data/metadata

  # API behavior
  # Milliseconds between requests — Binance Futures allows 2400 req/min,
  # each klines call = 10 weight. 250ms gives ~240 req/min (well within limits).
  request_delay_ms: 250
  max_retries: 3
  retry_delay_s: 5

  # Schema version — increment when the canonical Parquet schema changes
  schema_version: "1.0"

# ── Risk Management (Prompt 05) ─────────────────────────────────────────────
risk:
  risk_reward_ratio: 3.0
  risk_per_trade_pct: 1.0
  max_concurrent_positions: 5
  max_daily_loss_pct: 3.0
  daily_profit_target_pct: 2.0

# ── Execution Simulation (Prompt 03) ─────────────────────────────────────────
execution:
  fee_rate: null
  slippage_model: null

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level: INFO
  format: console
