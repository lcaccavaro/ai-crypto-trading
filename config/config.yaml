project:
  name: crypto_market_research_lab
  version: 1.0.0
research:
  market: crypto
  data_source: binance
assets:
- BTCUSDT
- ETHUSDT
- SOLUSDT
timeframes:
- 1m
- 5m
- 15m
- 1h
data:
  market_type: futures
  start_date: '2024-01-01'
  end_date: '2026-09-01'
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_dir: data/metadata
  request_delay_ms: 250
  max_retries: 3
  retry_delay_s: 5
  schema_version: '1.0'
backtest:
  start_date: '2026-08-19'
  end_date: '2026-09-17'
  symbols:
  - BTCUSDT
  timeframes:
  - 15m
execution:
  order_model: market
  slippage_bps: 2
  spread_bps: 1
  intrabar_fill_policy: stop_first
  gap_policy: fill_at_open
  allow_same_close_execution: false
costs:
  maker_fee_rate: 0.0002
  taker_fee_rate: 0.0005
capital:
  initial_balance: 10000.0
  risk_per_trade_pct: 1.0
risk:
  risk_reward_ratio: 3.0
  risk_per_trade_pct: 1.0
  max_concurrent_positions: 5
  max_total_exposure_pct: 100.0
  max_asset_exposure_pct: 50.0
  max_strategy_exposure_pct: 50.0
  daily_profit_target_pct: 2.0
  daily_loss_limit_pct: 3.0
  strategy_management:
    consecutive_loss_limit: 3
    cooldown:
      enabled: true
      value: 4
      unit: hours
    break_even_resets_losses: true
  opportunity_score:
    enabled: true
    minimum_score: 40.0
    version: 1.0.0
    components:
      trend_alignment:
        weight: 20.0
        enabled: true
      momentum:
        weight: 20.0
        enabled: true
      volatility:
        weight: 15.0
        enabled: true
      volume:
        weight: 15.0
        enabled: true
      risk_reward:
        weight: 20.0
        enabled: true
      multi_timeframe:
        weight: 10.0
        enabled: true
position_sizing:
  mode: risk_based
  fixed_quantity: null
logging:
  level: INFO
  format: console
reporting:
  enabled: true
  formats:
    csv: true
    json: true
    markdown: true
    html: true
  trade_diary:
    enabled: true
  trade_charts:
    enabled: true
    bars_before_entry: 100
    bars_after_entry: 100
    show_indicators: true
    show_entry: true
    show_stop: true
    show_target: true
    show_exit: true
  aggregation:
    timezone: UTC
  filters:
    minimum_score: null
    strategies: []
    symbols: []
    timeframes: []
  html:
    enabled: true
robustness:
  enabled: false
  run_type: DEVELOPMENT
  walk_forward:
    enabled: true
    mode: rolling
    train_period:
      value: 14
      unit: days
    validation_period:
      value: 5
      unit: days
    test_period:
      value: 5
      unit: days
    step:
      value: 3
      unit: days
  sensitivity:
    enabled: true
    risk_reward_ratios:
    - 2.0
    - 2.5
    - 3.0
    - 3.5
    - 4.0
    cost_multipliers:
    - 1.0
    - 1.25
    - 1.5
    - 2.0
    score_thresholds:
    - 40.0
    - 50.0
    - 60.0
    - 70.0
  regime:
    enabled: true
    trend:
      ma_period: 50
      slope_threshold_pct: 0.5
    volatility:
      atr_period: 14
      low_threshold_pct: 1.0
      high_threshold_pct: 3.0
  minimum_sample_sizes:
    trades: 30
    oos_windows: 5
  leave_one_out:
    assets: true
    strategies: false
    periods: false
  strategy_selection: false
paper_trading:
  enabled: false
  initial_balance: 10000.0
  market_data:
    provider: binance_public
    mode: polling
    poll_interval_seconds: 10.0
    max_retries: 3
    retry_delay_seconds: 2.0
    request_timeout_seconds: 10.0
    warmup_candles: 300
  session:
    auto_start: false
    resume_enabled: true
    max_duration_minutes: null
  safety:
    allow_real_orders: false
    require_paper_mode: true
  persistence:
    checkpoint_interval_seconds: 30
    results_dir: results/paper
  reporting:
    generate_trade_charts: true
    generate_session_report: true
    generate_daily_report: true
  drift:
    enabled: true
    signal_frequency_change_pct: 50.0
    score_mean_change_pct: 30.0
    rejection_rate_change_pct: 50.0
    cost_change_pct: 40.0
    min_paper_trades_for_drift: 20
  replay:
    enabled: false
    speed: 0.0
    dataset_start: null
    dataset_end: null
