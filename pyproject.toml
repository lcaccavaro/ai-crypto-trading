[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-research"
version = "1.0.0"
description = "Quantitative day-trading research laboratory for cryptocurrency markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "nbmake>=1.5",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (may create files/dirs)",
]

[tool.coverage.run]
source = ["src/crypto_research"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
